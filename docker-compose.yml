# Local infrastructure: MongoDB as a single-node replica set (transactions need one) + Redis.
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      retries: 10
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/taskflow?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    env_file: apps/api/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/taskflow?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
